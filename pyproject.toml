[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-sch-lint"
version = "0.1.0"
description = "Readability linter, renderer and text fixer for KiCad schematics, with an MCP server for AI assistants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
render = ["pymupdf"]

[project.scripts]
kschlint = "kschlint.cli:main"

[tool.setuptools]
packages = ["kschlint"]
